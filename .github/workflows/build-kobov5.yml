name: Build KOReader kobov5

on:
  workflow_dispatch:        # Start per Knopfdruck
  push:
    branches: [ tolino-v5 ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ca-certificates curl wget unzip p7zip-full patch \
            autoconf automake libtool pkg-config cmake ninja-build meson \
            gettext gperf help2man texinfo bison flex nasm \
            python3 python3-pip perl ccache file openssh-client \
            gcc-multilib g++-multilib libc6-dev-i386 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev \
            libgl1-mesa-dev libasound2-dev

      - name: Download kobov5 toolchain
        run: |
          curl -L -o kobov5.tar.gz \
            https://github.com/koreader/koxtoolchain/releases/latest/download/kobov5.tar.gz
          tar -xzf kobov5.tar.gz -C "$HOME"
          echo "$(echo "$HOME"/x-tools/*/bin)" >> "$GITHUB_PATH"

      - name: Fetch thirdparty
        run: ./kodev fetch-thirdparty

      - name: Build kobov5 release
        run: ./kodev release kobov5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: koreader-kobov5
          path: koreader-kobov5-*.zip
          if-no-files-found: error